apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  annotations:
#    konghq.com/strip-path: "true"
    konghq.com/strip-path: "false" 
spec:
  ingressClassName: kong
  rules:
    - host: app.381491852311.realhandsonlabs.net
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: prometheus-grafana
                port:
                  number: 80

